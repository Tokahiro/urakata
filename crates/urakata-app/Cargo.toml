[package]
name = "urakata-app"
description = "Settings window of urakata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Slint 1.19 needs Rust 1.95.
rust-version = "1.95"
publish = false

[dependencies]
urakata = { path = "../urakata" }

[target.'cfg(windows)'.dependencies]
# The software renderer needs no GPU driver, so the window opens on any PC.
slint = { version = "1.19", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
] }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.19"
